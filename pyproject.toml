[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperwheel"
version = "0.1.3"
description = "Upload pipeline from Hyperfine Swoop scanners to GRIP, running on a Raspberry Pi"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
# Exact pins. The full lock (transitive packages, with hashes) is in
# requirements/runtime.lock and requirements/dev.lock.
dependencies = [
    "requests==2.32.3",
    "pydicom==3.0.1",
    "paramiko==3.5.1",
]

[project.scripts]
hyperwheel = "hyperwheel.__main__:main"

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "grip_mock: runs against GRIP's hosted mock API (needs HYPERWHEEL_GRIP_MOCK_* settings)",
]
