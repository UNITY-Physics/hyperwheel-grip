# /etc/hyperwheel/routing.toml: which scanner logins go to which GRIP dataset.
# Written by hyperwheel setup and changed with hyperwheel datasets (add, change,
# remove), which check it first. Change it with those commands, not by hand.
#
# The login is the part of OperatorsName after the last '/', in lower case
# (e.g. "site_a/sandbox" -> "sandbox"). A login belongs to at most one dataset.
# A login that isn't listed here is never uploaded: its DICOM is deleted on the
# Pi and its raw files are never pulled from the scanner.
#
# Each dataset is named by its GRIP client ID. The name in [projects.<name>] is
# the dataset's name on the Pi (its folder and key file), made from the client
# ID. GRIP's address is the site's ([grip] in site.toml, from the site file).
# Each dataset's key is stored by
# hyperwheel datasets add, never here.
schema_version = 1

[projects.site-a-study-one]
client_id = "site-a-study-one"
logins = ["example"]
# Optional: Patient IDs that don't match are flagged (never changed).
# patient_id_pattern = 'R2-\d{4}'
