# Hyperwheel site file: one per site, kept privately by your Hyperwheel admin
# (no keys or passwords go in it). Paste it whole into `hyperwheel setup` on a
# newly flashed Pi, down to and including the last line. Setup checks it,
# shows it back to confirm, and writes the Pi's site settings from it.
#
# The values below are made up. Replace each one.
schema_version = 1

# A short name for the site: letters, digits, '.', '-' and '_'.
site = "site-a"

# The site's time zone and two-letter country code. Times on the Upload
# Monitor are local, and the hotspot uses the Wi-Fi channels allowed there.
time_zone = "Europe/London"
wifi_country = "GB"

# Which releases this Pi takes: stable (every site), pilot (the pilot site)
# or dev (the dev Pi only).
update_channel = "stable"

# The Patient ID this site uses for phantom scans. Leave out to skip the
# phantom check.
# phantom_patient_id = "PH-0001"

# Which scanner logins go to which GRIP project (a GRIP dataset). The login is
# the part of the scanner's operator name after the last '/', in lower case
# ("site_a/study_one" is "study_one"). A login that isn't listed here is never
# uploaded. Each project's key is stored on the Pi with `hyperwheel keys set`.
[projects.SiteA-StudyOne]
logins = ["study_one"]
api_base_url = "https://grip.example.org/api"
token_url = "https://grip.example.org/api/get/token"
# Optional: Patient IDs that don't look like this are flagged (never changed).
# patient_id_pattern = 'S1-\d{4}'

[projects.SiteA-Sandbox]
logins = ["sandbox", "phantom"]
api_base_url = "https://grip.example.org/api"
token_url = "https://grip.example.org/api/get/token"

# end of site file
