# Hyperwheel site file: one per site, kept privately by your Hyperwheel admin
# (no keys or passwords go in it). Paste it whole into `hyperwheel setup` on a
# newly flashed Pi, down to and including the last line. Setup checks it,
# shows it back to confirm, and writes the Pi's site settings from it.
#
# The values below are made up. Replace each one.
schema_version = 1

# A short name for the site: letters, digits, '.', '-' and '_'.
site = "site-a"

# The site's time zone and two-letter country code. Times on the Upload
# Monitor are local, and the hotspot uses the Wi-Fi channels allowed there.
time_zone = "Europe/London"
wifi_country = "GB"

# Which releases this Pi takes: stable (every site), pilot (the pilot site)
# or dev (the dev Pi only).
update_channel = "stable"

# The Patient ID this site uses for phantom scans. Leave out to skip the
# phantom check.
# phantom_patient_id = "PH-0001"

# Whether laptops and phones on the Pi's Wi-Fi can reach the scanner's web
# interface and the internet through the Pi. Leave out to allow it.
# hotspot_routing = false

# GRIP datasets are usually added after setup, by the data manager, with
# `hyperwheel datasets add` (it asks for the dataset's client ID, its scanner
# login and its secret). They can also be listed here, without their keys:
# [projects.site-a-study-one]
# client_id = "site-a-study-one"
# logins = ["study_one"]
# The login is the part of the scanner's operator name after the last '/', in
# lower case ("site_a/study_one" is "study_one"). A login that isn't listed is
# never uploaded.

# GRIP's address and region for the site (required). GRIP gives them to your
# Hyperwheel admin. The address is never in the release or the public repository.
# The region (a lower-case name GRIP gives) is where GRIP stores the site's data.
[grip]
api_base_url = "https://grip.example.org/api"
token_url = "https://grip.example.org/api/get/token"
region = "region-a"

# end of site file
