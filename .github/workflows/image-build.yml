# Build the Hyperwheel image: the pinned official Raspberry Pi OS image with a signed release installed and
# Hyperwheel's changes applied (tools/image/build-image.sh). No secrets: the release and the admin password file
# are public and signed, and the hotspot password is added later, on the admin's Mac, to a private copy.
#
# Run by hand with a published release: the image is kept as an artifact for the admin to download.
# On a pull request that changes the image, an image is built from that commit's code with a throwaway signing
# key, to prove it builds and passes its checks. It's never kept.
name: Build image

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Published release to preinstall, such as 0.1.13"
        required: true
      version:
        description: "The image's version, a date such as 2026-11-20 (empty: today)"
        required: false
  pull_request:
    paths:
      - ".github/workflows/image-build.yml"
      - "image/**"
      - "tools/image/build-image.sh"
      - "tools/image/find-private-keys.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The image's version and release
        env:
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
        run: |
          version=${VERSION:-$(date -u +%Y-%m-%d)}
          [[ "$version" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]] || { echo "Not a date: $version"; exit 1; }
          echo "IMAGE_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release version: $RELEASE"; exit 1; }
            echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          fi
          df -h / "${RUNNER_TEMP}"

      - name: The admin password file (published, signed)
        run: gh release download admin-password -R "$GITHUB_REPOSITORY" -p admin.json -p admin.json.sig -D build/admin

      - name: The published release
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release download "v$RELEASE" -R "$GITHUB_REPOSITORY" -p "hyperwheel-$RELEASE-arm64.tar" -D build
          tar -xf "build/hyperwheel-$RELEASE-arm64.tar" -C build
          echo "RELEASE_FOLDER=build/hyperwheel-$RELEASE" >> "$GITHUB_ENV"
          cp release/allowed_signers build/signers

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.13"
      - name: A release from this commit, signed with a throwaway key (test only)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --no-deps -r requirements/dev.lock
          python -m pip install --no-deps -e .
          tools/release/fetch_debs.sh build/debs
          python tools/release/build_release.py build --debs build/debs --out build/releases
          ssh-keygen -q -t ed25519 -N '' -f build/throwaway
          cp release/allowed_signers build/signers
          printf 'image-test namespaces="hyperwheel-release" %s\n' "$(cut -d' ' -f1,2 build/throwaway.pub)" >> build/signers
          ssh-keygen -q -Y sign -f build/throwaway -n hyperwheel-release build/releases/hyperwheel-*/manifest.json
          echo "RELEASE_FOLDER=$(ls -d build/releases/hyperwheel-*/)" >> "$GITHUB_ENV"

      - name: Build the image
        run: sudo tools/image/build-image.sh "$RELEASE_FOLDER" build/signers build/admin "$IMAGE_VERSION" build/image

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: hyperwheel-${{ env.IMAGE_VERSION }}
          path: build/image/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
